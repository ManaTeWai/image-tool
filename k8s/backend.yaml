apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: imgconv
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: <registry>/img-backend:v1
          ports: [{ containerPort: 3001 }]
          env:
            - name: PORT
              value: "3001"
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits:   { cpu: "1",    memory: "1Gi" }
          readinessProbe:
            httpGet: { path: /healthz, port: 3001 }
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: 3001 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: imgconv
spec:
  selector: { app: backend }
  ports:
    - port: 3001
      targetPort: 3001