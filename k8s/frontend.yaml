apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: imgconv
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: <registry>/img-frontend:v1
          ports: [{ containerPort: 3000 }]
          env:
            - name: PORT
              value: "3000"
            # чтобы фронт звал бэкенд по внутреннему DNS
            - name: NEXT_PUBLIC_API_URL
              value: "http://backend.imgconv.svc.cluster.local:3001"
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: imgconv
spec:
  selector: { app: frontend }
  ports:
    - port: 3000
      targetPort: 3000